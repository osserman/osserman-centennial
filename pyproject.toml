[project]
name = "msl"
version = "0.1.0"
description = "Minimal Surface Lineages: tracing the migration of minimal surface mathematics into applied disciplines"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/msl"]
